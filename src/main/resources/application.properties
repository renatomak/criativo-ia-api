spring.application.name=criativo-ia-api
server.address=127.0.0.1
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=101MB
spring.servlet.multipart.file-size-threshold=0
spring.jackson.deserialization.fail-on-unknown-properties=true
app.storage=${CRIATIVOS_DATA_DIR:./dados/produtos}
claude.model=${CLAUDE_MODEL:claude-haiku-4-5}
claude.timeout-seconds=${CLAUDE_TIMEOUT_SECONDS:30}
